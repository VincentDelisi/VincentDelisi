name: Update profile card

on:
  schedule:
    - cron: "0 10 * * *"      # daily, ~6am Eastern
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths-ignore: ["*.svg"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python generate.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m "Update profile stats" && git push)
